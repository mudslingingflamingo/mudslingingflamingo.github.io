<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mudslinging Flamingo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Neonderthaw&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #f7a8ae;
      color: #2f7f73;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      padding: 70px 24px 60px;
      text-align: center;
    }

    h1 {
      font-family: "Neonderthaw", cursive;
      font-size: 5.5rem;
      font-weight: 400;
      line-height: 0.95;
      margin: 0 0 30px;
      color: #2f7f73;
    }

    .tagline {
      font-size: 1.7rem;
      font-weight: bold;
      margin-bottom: 28px;
    }

    .intro {
      font-size: 1.25rem;
      max-width: 670px;
      margin: 0 auto 28px;
    }

    .divider {
      font-size: 1.7rem;
      margin: 24px 0;
      letter-spacing: 8px;
    }

    .coming-soon {
      font-size: 1.2rem;
      margin-bottom: 28px;
    }

    .buttons {
      margin-top: 28px;
    }

    .button {
      display: inline-block;
      margin: 8px;
      padding: 13px 26px;
      border: 2px solid #2f7f73;
      border-radius: 999px;
      background: #c7e9d4;
      color: #2f7f73;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s ease;
    }

    .button:hover {
      background: #fffaf0;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 55px;
      font-size: 0.95rem;
    }

    @media (max-width: 650px) {
      .container {
        padding-top: 50px;
      }

      h1 {
        font-size: 4rem;
      }

      .tagline {
        font-size: 1.4rem;
      }

      .intro {
        font-size: 1.1rem;
      }

      .button {
        display: block;
        max-width: 280px;
        margin: 10px auto;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Mudslinging<br>Flamingo</h1>

    <div class="tagline">
      Playing in the mud so your plants can thrive.
    </div>

    <div class="intro">
      Handmade ceramics and plant-friendly pots,
      made in small batches in Alexandria, Virginia.
    </div>

    <div class="divider">
      ✦ ✧ ✦
    </div>

    <div class="coming-soon">
      New pieces are coming soon.
    </div>

    <div class="buttons">

      <a class="button"
         href="https://instagram.com/mudslingingflamingo"
         target="_blank">
        Follow on Instagram
      </a>

      <a class="button"
         href="mailto:mudslingingflamingo@gmail.com">
        Get in Touch
      </a>

    </div>

    <footer>
      © 2026 Mudslinging Flamingo
    </footer>

  </div>

</body>
</html>
